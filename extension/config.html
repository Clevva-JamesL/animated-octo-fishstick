<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Death Counter Config</title>
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  </head>
  <body>
    <main>
      <h1>Death Counter Setup</h1>
      <div id="status" data-state="loading" aria-busy="true">Waiting for Twitch authorization…</div>

      <form id="session-form" class="stack">
        <label>
          Game
          <div class="combobox">
            <div id="game-selected" class="combobox-selected" hidden>
              <img class="combobox-art" alt="" hidden />
              <span class="combobox-name"></span>
              <button type="button" class="combobox-clear" aria-label="Clear game">Clear</button>
            </div>
            <input
              id="game"
              name="game"
              type="text"
              maxlength="120"
              placeholder="Search Twitch games"
              autocomplete="off"
              role="combobox"
              aria-expanded="false"
              aria-controls="game-list"
              aria-autocomplete="list"
            />
            <ul id="game-list" class="combobox-list" hidden role="listbox"></ul>
          </div>
        </label>
        <label>
          Run
          <input id="run" name="run" type="text" maxlength="120" placeholder="Optional run / attempt" />
        </label>
        <div class="actions">
          <button type="submit" id="start-btn" disabled>
            <span class="btn-spinner" aria-hidden="true"></span>
            <span data-label>Start session</span>
          </button>
          <button type="button" id="save-btn" disabled>
            <span class="btn-spinner" aria-hidden="true"></span>
            Update current
          </button>
          <button type="button" id="end-btn" class="danger" disabled>
            <span class="btn-spinner" aria-hidden="true"></span>
            End session
          </button>
        </div>
      </form>

      <p id="session-summary" class="meta">No active session</p>
    </main>
    <script type="module" src="/src/config/main.ts"></script>
  </body>
</html>
