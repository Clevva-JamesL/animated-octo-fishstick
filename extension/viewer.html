<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Death Counter</title>
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  </head>
  <body>
    <main>
      <h1>Death Counter</h1>
      <p id="session-label">No active session</p>
      <div id="status" data-state="loading" aria-busy="true">Waiting for Twitch authorization…</div>

      <section class="counts" aria-label="Death counts">
        <div class="count">
          <span class="count-value" id="count-stream">0</span>
          <span class="count-label">Stream</span>
        </div>
        <div class="count">
          <span class="count-value" id="count-game">0</span>
          <span class="count-label">Game</span>
        </div>
        <div class="count">
          <span class="count-value" id="count-run">0</span>
          <span class="count-label">Run</span>
        </div>
      </section>

      <section class="deaths" aria-label="Deaths by category">
        <details class="death-group" id="group-stream" open>
          <summary>
            <span class="death-group-name">Stream</span>
            <span class="death-group-count" id="count-list-stream">0</span>
          </summary>
          <ul id="death-list-stream"></ul>
        </details>
        <details class="death-group" id="group-game">
          <summary>
            <span class="death-group-name">Game</span>
            <span class="death-group-count" id="count-list-game">0</span>
          </summary>
          <ul id="death-list-game"></ul>
        </details>
        <details class="death-group" id="group-run">
          <summary>
            <span class="death-group-name">Run</span>
            <span class="death-group-count" id="count-list-run">0</span>
          </summary>
          <ul id="death-list-run"></ul>
        </details>
        <div id="death-groups-tags" hidden></div>
      </section>
    </main>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
