<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Death Counter Live Config</title>
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  </head>
  <body>
    <main>
      <h1>Live Controls</h1>
      <div id="status">Waiting for Twitch authorization…</div>

      <section class="counts" aria-label="Death counts">
        <div class="count">
          <span class="count-value" id="count-stream">0</span>
          <span class="count-label">Stream</span>
        </div>
        <div class="count">
          <span class="count-value" id="count-game">0</span>
          <span class="count-label">Game</span>
        </div>
        <div class="count">
          <span class="count-value" id="count-run">0</span>
          <span class="count-label">Run</span>
        </div>
      </section>

      <div class="stack">
        <label>
          Note (optional)
          <input id="note" type="text" maxlength="500" placeholder="Boss / cause of death" />
        </label>
        <button type="button" id="plus-one" class="primary" disabled>+1 Death</button>
      </div>

      <p id="last-death" class="meta">No deaths yet</p>
    </main>
    <script type="module" src="/src/live_config/main.ts"></script>
  </body>
</html>
