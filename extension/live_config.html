<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Death Counter Live Config</title>
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  </head>
  <body>
    <main>
      <h1>Live Controls</h1>
      <div id="status" data-state="loading" aria-busy="true">Waiting for Twitch authorization…</div>

      <section class="counts" aria-label="Death counts">
        <div class="count">
          <span class="count-value" id="count-stream">0</span>
          <span class="count-label">Stream</span>
        </div>
        <div class="count">
          <span class="count-value" id="count-game">0</span>
          <span class="count-label">Game</span>
        </div>
        <div class="count">
          <span class="count-value" id="count-run">0</span>
          <span class="count-label">Run</span>
        </div>
      </section>

      <div class="stack">
          <label>
            Note (optional)
            <input id="note" type="text" maxlength="500" placeholder="Cause of death" />
          </label>
          <div class="tag-row">
            <label>
              Tag
              <select id="tag-type">
                <option value="">None</option>
                <option value="boss">Boss</option>
                <option value="character">Character</option>
              </select>
            </label>
            <label>
              Name
              <input id="tag-value" type="text" maxlength="120" placeholder="Malenia" disabled />
            </label>
          </div>
          <button type="button" id="plus-one" class="primary" disabled>
          <span class="btn-spinner" aria-hidden="true"></span>
          +1 Death
        </button>
      </div>

      <section id="last-death-card" class="last-death" hidden>
        <h2>Last death</h2>
        <p id="last-death-when" class="meta">—</p>
        <div class="stack">
          <label>
            Note
            <input id="last-note" type="text" maxlength="500" />
          </label>
          <div class="tag-row">
            <label>
              Tag
              <select id="last-tag-type">
                <option value="">None</option>
                <option value="boss">Boss</option>
                <option value="character">Character</option>
              </select>
            </label>
            <label>
              Name
              <input id="last-tag-value" type="text" maxlength="120" placeholder="Malenia" disabled />
            </label>
          </div>
          <label>
            Clip URL
            <input
              id="last-clip"
              type="text"
              maxlength="512"
              placeholder="https://clips.twitch.tv/…"
            />
          </label>
          <div class="actions">
            <button type="button" id="save-last">
              <span class="btn-spinner" aria-hidden="true"></span>
              Save
            </button>
            <button type="button" id="undo-last" class="danger">
              <span class="btn-spinner" aria-hidden="true"></span>
              Undo
            </button>
          </div>
        </div>
      </section>

      <p id="last-death-empty" class="meta" hidden></p>
    </main>
    <script type="module" src="/src/live_config/main.ts"></script>
  </body>
</html>
